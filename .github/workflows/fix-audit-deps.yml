name: Fix dependency audit findings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-audit-deps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Use current compatible npm
        run: npm install --global npm@11
      - name: Upgrade patched direct dependencies
        run: npm install next@16.3.5 eslint-config-next@16.3.5 pdfjs-dist@6.3.289 vitest@4.1.11
      - name: Apply safe transitive advisory fixes
        run: npm audit fix
      - name: Require no high or critical advisories
        run: npm audit --audit-level=high
      - name: Verify install, tests and build
        run: |
          npm run typecheck
          npm run test:ci
          npm run build
      - name: Commit repaired dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "Update dependencies for security audit"
          git pull --rebase origin main
          git push
